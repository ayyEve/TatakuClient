prepare-release:
  stage: release
  image: curlimages/curl
  rules:
    - if: $CI_COMMIT_TAG
      when: never # Do not run this job when a tag is created manually
    - if: $CI_MERGE_REQUEST_ID
      when: never # Do not run this job for merge requests
    - if: $CI_COMMIT_REF_PROTECTED # Run this job when commits are pushed or merged to a protected branch
  script:
    - echo DATETIME='$(git show -s --format="%cd" --date=format:"%Y%m%d%H%M")' >> vars.env
    - echo Removing old tag and release
    - "curl -X DELETE -H 'PRIVATE-TOKEN: $GITLAB_API_TOKEN' '$CI_API_V4_URL/projects/$CI_PROJECT_ID/tags/latest-$CI_COMMIT_BRANCH' || _ignore=$?"
  artifacts:
    reports:
      dotenv: vars.env

releases:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: never # Do not run this job when a tag is created manually
    - if: $CI_MERGE_REQUEST_ID
      when: never # Do not run this job for merge requests
    - if: $CI_COMMIT_REF_PROTECTED # Run this job when commits are pushed or merged to a protected branch
  needs:
    - job: prepare-release
      artifacts: true
    - job: build-linux
      artifacts: true
    - job: build-windows
      artifacts: true
  script:
    - echo Creating release $CI_COMMIT_BRANCH-$DATETIME
  release:
    tag_name: latest-$CI_COMMIT_BRANCH
    description: 'Automatic $CI_COMMIT_BRANCH release'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: Linux x86_64
          url: $LINUX_JOB/artifacts/file/target/release/tataku-client
        - name: Windows x86_64
          url: $WINDOWS_JOB/artifacts/file/target/x86_64-pc-windows-gnu/release/tataku-client.exe
