stages:
  - build-client
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH # Run always for branch pipelines
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED
      when: never # Do not run for merge requests on protected branches. These have automatic releases.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # Run for non-protected merge requests

build-linux:
  stage: build-client
  image: ayyeve/tataku-client-build:latest
  interruptible: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never # Do not run this job when a tag is created
    - when: on_success
  script:
    - ~/.cargo/bin/cargo mommy build --release
  after_script:
    - echo "LINUX_JOB=$CI_JOB_URL" >> job.env
    # curl image doesn't have git and i cba
    - echo DATETIME="$(git show -s --format='%cd' --date=format:'%Y%m%d%H%M')" >> job.env
  tags:
    - docker
    - linux
  artifacts:
    paths:
      - target/release/tataku-client
    reports:
      dotenv: job.env

build-windows:
  stage: build-client
  image: ayyeve/tataku-client-build:latest
  interruptible: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never # Do not run this job when a tag is created
    - when: on_success
  script:
    # Cross-compiled from linux
    - ~/.cargo/bin/cargo mommy build --release --target x86_64-pc-windows-gnu
  after_script:
    - echo "WINDOWS_JOB=$CI_JOB_URL" >> job.env
  tags:
    - docker
    - linux
  artifacts:
    paths:
      - target/x86_64-pc-windows-gnu/release/tataku-client.exe
    reports:
      dotenv: job.env

