# wgpu
bytemuck.workspace = true
wgpu.workspace = true
lyon_tessellation.workspace = true

vello = { version = "0.5.0", git="https://github.com/linebender/vello.git", optional = true, features = [ "debug_layers" ] }
parley.workspace = true
