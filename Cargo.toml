[workspace.package]
authors = [
    "Eve <hi.its.eve@gmail.com>",
    "~Nebula~ <stefanb1289@gmail.com>"
]
edition = "2024"

[workspace]
members = [ "crates/*", "gamemodes/*" , "integrations/*"]
default-members = [ "crates/tataku-client" ]
resolver = "2"

[workspace.lints]
clippy.new_without_default = "allow"
clippy.too_many_arguments = "allow"
clippy.module_inception = "allow"
clippy.type_complexity = "allow"
clippy.todo = "warn"

clippy.bool_to_int_with_if = "warn"
clippy.cloned_instead_of_copied = "warn"
clippy.comparison_chain = "warn"
clippy.default_trait_access = "warn"
clippy.filter_map_next = "warn"
clippy.format_collect = "warn"
clippy.implicit_clone = "warn"
clippy.inefficient_to_string = "warn"
clippy.map_unwrap_or = "warn"
clippy.match_wild_err_arm = "warn"
clippy.needless_continue = "warn"
clippy.needless_for_each = "warn"
# clippy.needless_pass_by_value = "warn"
clippy.option_option = "warn"
clippy.option_as_ref_cloned = "deny"
clippy.ref_option = "warn"
clippy.semicolon_if_nothing_returned = "warn"

rust.unused_must_use = "deny"

[workspace.dependencies]
tataku-common = { version = "0.17.0", registry = "tataku-registry" }
# tataku-common = { version = "0.16.0", registry = "tataku-registry" }

tataku-client-proc-macros.path = "crates/proc_macros"
tataku-engine.path = "crates/tataku-engine"
tataku-game.path = "crates/tataku-game"
tataku-resources.path = "crates/tataku-resources"
tataku-client.path = "crates/tataku-client"
tataku-client-common.path = "crates/common"
tataku-interface.path = "crates/tataku-interface"
tataku-input.path = "crates/tataku-input"

tataku-wgpu.path = "crates/tataku-wgpu"
tataku-bass.path = "crates/tataku-bass"
tataku-kira.path = "crates/tataku-kira"

# Gamemodes
gamemode-osu.path = "gamemodes/osu"
gamemode-taiko.path = "gamemodes/taiko"
gamemode-mania.path = "gamemodes/mania"
gamemode-utyping.path = "gamemodes/utyping"

# Integrations
integration-discord.path = "integrations/discord"
integration-lastfm.path = "integrations/lastfm"
integration-media-controls.path = "integrations/media_controls"



# framework stuff
lazy_static = "1.5.0"
parking_lot = "0.12.3"
tokio = { version = "1.44.2", features = [ "full" ] }
rusqlite = { version = "0.34.0", features = [ "bundled" ] }
futures-util = { version = "0.3.31", features = [ "async-await", "sink", "std" ] }
async-trait = "0.1.87"
async-recursion = "1.1.1"
triple_buffer = "8.1.0"
crossbeam = "0.8.4"
bitflags = "2.9"

libloading = "0.8.6"

# image stuff
image = { version = "0.25.5", default-features = false, features = [ "png", "jpeg", "gif" ]}
fontdue = "0.9.2"

# math stuff
cgmath = "0.18.0"
guillotiere = "0.6.2"
lyon_tessellation = "1.0.15"

# windowing
bytemuck = { version = "1.21.0", features = [ "derive" ] }
winit = { version = "0.30.7", features = [ "serde" ] }
raw-window-handle = "0.6.2"
clipboard = "0.5.0"
wgpu = "23.0.1"

# gamepad input
gilrs = { version = "0.11.0", features = [ "serde-serialize" ] }

# gui
taffy = { version = "0.7.7", features = [ "serde" ] }
simplecss = { version = "0.2.2", git = "https://github.com/ayyEve/simplecss.git", features = ["at_rules"] }
quick-xml = { version = "0.37", features = [ "serialize" ]}

# networking
rustls = "0.23.26"
native-tls = "0.2.14"
tokio-native-tls = "0.3.1"
tokio-tungstenite = { version = "0.26.2", features = [ "rustls-tls-native-roots" ] }
reqwest = { version = "0.12.15", features = [ "json", "blocking" ] }

# serde
serde = { version = "1.0.219", features = [ "derive" ] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"

# decoding/encoding/zip stuff
sha2 = "0.10.8"
zip = { version = "2.2.3", default-features = false, features = [ "deflate", "deflate64", "bzip2" ] }
md5 = "0.7.0"
lzma-rs = "0.3.0"
base64 = "0.22.1"
encoding_rs = { version = "0.8.35" }


# other stuff
rand = "0.9.0"
chrono = "0.4.39"
fs_extra = "1.3.0"
cacache = "13.1.0"
uuid = { version = "1.11.0", features = [ "v4" ] }
paste = "1.0"


# logging
tracing = "0.1.41"
num-format = "0.4.4"
strfmt = "0.2.4"

# battery_level = { git = "https://gitlab.ayyeve.dev/ayyEve/battery-level-rs" }

[profile.dev]
opt-level = 3
