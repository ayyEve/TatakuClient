[workspace.package]
authors = [
    "Eve <hi.its.eve@gmail.com>",
    "~Nebula~ <stefanb1289@gmail.com>"
]
edition = "2024"

[workspace]
members = [ "crates/*", "gamemodes/*" ]
default-members = [ "crates/tataku-client" ]
resolver = "2"

[workspace.lints.clippy]
too_many_arguments = "allow"
module_inception = "allow"
type_complexity = "allow"

[workspace.dependencies]
# tataku-common = { version = "0.16.0", path = "../tataku-common/tataku-common", registry = "tataku-registry" }
tataku-common = { version = "0.16.0", registry = "tataku-registry" }

# tataku-common-proc-macros = { version = "0.3.2", registry = "tataku-registry", path = "../tataku-common/tataku-common" }

tataku-client-proc-macros = { version = "0.2.0", path = "crates/proc_macros", registry = "tataku-registry" }

tataku-engine.path = "crates/tataku-engine"
tataku-game.path = "crates/tataku-game"
tataku-resources.path = "crates/tataku-resources"
tataku-client.path = "crates/tataku-client"
tataku-client-common.path = "crates/common"
tataku-interface.path = "crates/tataku-interface"
tataku-input.path = "crates/tataku-input"

tataku-wgpu.path = "crates/tataku-wgpu"
tataku-bass.path = "crates/tataku-bass"


gamemode-osu.path = "gamemodes/osu"
gamemode-taiko.path = "gamemodes/taiko"
gamemode-mania.path = "gamemodes/mania"
gamemode-utyping.path = "gamemodes/utyping"



# framework stuff
lazy_static = "1.5.0"
parking_lot = "0.12.3"
tokio = { version = "1.43.0", features = [ "full" ] }
rusqlite = { version = "0.33.0", features = [ "bundled" ] }
futures-util = { version = "0.3.31", features = [ "async-await", "sink", "std" ] }
async-trait = "0.1.86"
async-recursion = "1.1.1"
triple_buffer = "8.1.0"
crossbeam = "0.8.4"
ipc-channel = "0.19.0"

libloading = "0.8.6"

# image stuff
png = "0.17.16"
image = "0.25.5"
fontdue = "0.9.2"

# math stuff
cgmath = "0.18.0"
guillotiere = "0.6.2"
lyon_tessellation = "1.0.15"

# windowing
bytemuck = { version = "1.21.0", features = [ "derive" ] }
winit = { version = "0.30.7", features = [ "serde" ] }
raw-window-handle = "0.6.2"
clipboard = "0.5.0"
wgpu = "23.0.1"

# gamepad input
gilrs = { version = "0.11.0", features = [ "serde-serialize" ] }
# media controls TODO:!! update this when fixing media controls
souvlaki = { version = "0.7.3", default-features = false, features = [ "use_zbus" ] }

# gui
taffy = { version = "0.7.6", features = [ "serde" ] }

# other audio
# kira = "0.7"
# rustfft = { version = "6.0" }

# networking
rustls = "0.23.23"
native-tls = "0.2.12"
tokio-native-tls = "0.3.1"
tokio-tungstenite = { version = "0.26.2", features = [ "rustls-tls-native-roots" ] }
reqwest = { version = "0.12.12", features = [ "json" ] }
discord-rich-presence = { version = "0.2.4", registry = "tataku-registry" }

# serde
serde = { version = "1.0.218", features = [ "derive" ] }
serde_json = "1.0.139"
serde_yaml = "0.9.34"

# decoding/encoding/zip stuff
sha2 = "0.10.8"
zip = "2.2.2"
md5 = "0.7.0"
lzma-rs = "0.3.0"
base64 = "0.22.1"
encoding_rs = "0.8.35"


# other stuff
rand = "0.9.0"
chrono = "0.4.39"
fs_extra = "1.3.0"
cacache = "13.1.0"
uuid = { version = "1.11.0", features = [ "v4" ] }
mlua = { version = "0.10.3", features = [ "lua54" ] }


# logging
tracing = "0.1.41"
num-format = "0.4.4"
strfmt = "0.2.4"

# battery_level = { git = "https://gitlab.ayyeve.dev/ayyEve/battery-level-rs" }

[profile.dev]
opt-level = 3