prepare-release:
  stage: release
  image: curlimages/curl
  interruptible: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never # Do not run this job when a tag is created manually
    - if: $CI_MERGE_REQUEST_ID
      when: never # Do not run this job for merge requests
    - if: $CI_COMMIT_REF_PROTECTED # Run this job only when commits are pushed or merged to a protected branch
    - when: never
  script:
    - echo Removing old tag and release on branch $CI_COMMIT_BRANCH
    - 'curl -X DELETE -H "PRIVATE-TOKEN: $GITLAB_API_TOKEN" "https://gitlab.ayyeve.dev/api/v4/projects/$CI_PROJECT_ID/repository/tags/latest-$CI_COMMIT_BRANCH" || _ignore=$?'

releases:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  interruptible: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never # Do not run this job when a tag is created manually
    - if: $CI_MERGE_REQUEST_ID
      when: never # Do not run this job for merge requests
    - if: $CI_COMMIT_REF_PROTECTED # Run this job only when commits are pushed or merged to a protected branch
    - when: never
  needs:
    - job: build-linux
      artifacts: true
    - job: build-windows
      artifacts: true
  script:
    - echo Creating release "$CI_COMMIT_BRANCH-$DATETIME"
  release:
    tag_name: latest-$CI_COMMIT_BRANCH
    name: $CI_COMMIT_BRANCH-$DATETIME
    description: 'Automatic $CI_COMMIT_BRANCH release'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: Linux x86_64
          url: $LINUX_JOB/artifacts/file/target/release/tataku-client
        - name: Windows x86_64
          url: $WINDOWS_JOB/artifacts/file/target/x86_64-pc-windows-gnu/release/tataku-client.exe
